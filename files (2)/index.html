<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buon Compleanno Papà</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- SEZIONE 1: Hero -->
  <section class="section hero" id="hero">
    <div class="particles" id="particles"></div>
    <div class="hero-content">
      <div class="sparkle-ring"></div>
      <!--<p class="subtitle-top">con tutto il nostro amore</p><-->
      <h1 class="hero-title">Buon compleanno<br/><em>papà</em></h1>
      <div class="hero-date">53 e sto.</div>
      <div class="scroll-hint">
        <span>Se vuoi puoi anche scorrere</span>
        <div class="arrow-down"></div>
      </div>
    </div>
    <div class="wave-divider">
      <svg viewBox="0 0 1440 80" preserveAspectRatio="none">
        <path d="M0,40 C360,80 1080,0 1440,40 L1440,80 L0,80 Z"/>
      </svg>
    </div>
  </section>

  <!-- SEZIONE 2: Griglia Polaroid -->

    <div class="section-label">I nostri migliori ricordi</div>
    <h2 class="section-title">Momenti indimenticabili</h2>
    <div class="polaroid-grid">
      <div class="polaroid" data-rotate="-3">
        <div class="polaroid-img">
          <div class="img-placeholder">
            <svg viewBox="0 0 80 80"><circle cx="40" cy="30" r="16" fill="rgba(255,255,255,0.4)"/><ellipse cx="40" cy="62" rx="24" ry="14" fill="rgba(255,255,255,0.3)"/></svg>
            <span><img src="img1test.jpg"></span>
          </div>
        </div>
        
      </div>
      <div class="polaroid" data-rotate="2">

            <span><img src="img2.jpg"></span>

        </div>

            <span><img src="img4.jpg"></span>

        </div>

      </div>
      <div class="polaroid" data-rotate="-2">

      </div>
      
    </div>
  </section>

  <!-- SEZIONE 3: Foto/Video grande -->
  <section class="section media-section" id="media">
    <h2 class="section-title">Un ricordo nel cuore</h2>
    <div class="media-frame">
      <div class="media-placeholder">
        <div class="media-icon">
          <svg viewBox="0 0 120 120" width="80" height="80">
            <circle cx="60" cy="40" r="22" fill="rgba(255,255,255,0.25)"/>
            <ellipse cx="60" cy="88" rx="34" ry="20" fill="rgba(255,255,255,0.2)"/>
            <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-dasharray="6 4"/>
          </svg>
        </div>
        <span><img src="img16tris.jpg"></span>
      </div>
    </div>
    <p class="media-caption">Ogni momento con te è un tesoro da custodire per sempre.</p>
  </section>

  <!-- SEZIONE 4: Messaggio finale -->
  <section class="section final-section" id="finale">
    <div class="final-bg"></div>
    <div class="hearts-container" id="hearts"></div>
    <div class="final-content">
      <div class="final-deco top-deco">✦ ✦ ✦</div>
      <p class="final-message">Ti vogliamo<br/><span class="final-highlight">tanto bene</span></p>
      <div class="final-deco bottom-deco">♡</div>
    </div>
  </section>

  <script src="script.js"></script>

</html>
